// Types the Compose compiler cannot prove stable, and which are.
//
// Strong skipping is on, so an unstable parameter is not skipped-never — it is
// compared by *instance identity*. A caller that writes `ClipFormat("image/png")`
// inline hands a fresh instance every recomposition, and everything downstream
// re-runs even though the format is the same one. Compared by `equals` instead,
// it skips.
//
// Nothing in this library's own package needs listing: `ClipFormat` is a value
// class over a String and the rest are `@Immutable`. These are the standard
// library types that show up unstable for the usual reason — they do not depend
// on Compose, so nobody could annotate them.
kotlin.ranges.IntRange
kotlin.ranges.LongRange

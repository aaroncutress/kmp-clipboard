#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# `iosSimulatorArm64Test` cannot run on Linux, which is every CI run and most
# development here. Without this the build prints a four-line warning about it on
# every invocation, and a warning nobody can act on is a warning everybody learns
# to scroll past.
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

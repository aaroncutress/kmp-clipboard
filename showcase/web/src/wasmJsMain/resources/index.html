        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

<!--
  `ComposeViewport(document.body)` fills the body, so there is no canvas element
  to declare here.

  Worth knowing while testing: the Clipboard API needs a secure context, so this
  page works on https and on localhost and nowhere else. `wasmJsBrowserRun`
  serves it on localhost, which is why that is the way to try it.
-->
<script src="showcase.js"></script>
